[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpoker-ai-arena"
version = "1.0.0"
description = "Strategy-first NLHE tournament agent, simulator, trainer, replay collector, and live driver for Agent Poker."
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PyYAML>=6,<7"]

[project.scripts]
agentpoker = "agentpoker.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["agentpoker*"]
